name: pages

# Builds the engine and the web app, adds the newest dataset release, and
# deploys the site to Cloudflare as a Worker that serves its files, set up
# in web/wrangler.jsonc. A data release from the pipeline
# triggers it too. Run it by hand with an older data-* tag to roll the data
# back. Needs the CLOUDFLARE_API_TOKEN secret; wrangler finds the account
# from the token.
on:
  push:
    branches: [main]
    paths: [engine/**, web/**, .github/workflows/pages.yml]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      data:
        description: Data release to deploy, like data-6eae0101 (newest when empty)
        required: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.12
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: sudo apt-get install -y ninja-build
      - name: Build the engine
        run: |
          emcmake cmake -S engine -B engine/build-wasm -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build engine/build-wasm
          mkdir -p web/public/engine
          cp engine/build-wasm/engine.js engine/build-wasm/engine.wasm web/public/engine/
      - name: Download the dataset and sprites
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.data }}
        run: |
          tag="$TAG"
          if [ -z "$tag" ]; then
            tag=$(gh release list --limit 100 --json tagName --jq '[.[] | select(.tagName | startswith("data-"))][0].tagName')
          fi
          if [[ "$tag" != data-* ]]; then
            echo "no data-* release to deploy"
            exit 1
          fi
          echo "deploying dataset $tag"
          mkdir -p web/public/data
          # Sprites and status are optional; the site does without them.
          gh release download "$tag" --pattern dataset.json --pattern 'sprites.*' --pattern status.json --dir web/public/data
      - name: Check the engine reads the dataset
        run: node engine/wasm/smoke.mjs web/public/engine/engine.js web/public/data/dataset.json
      - name: Build the site
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.149.0"
          workingDirectory: web
          command: deploy

